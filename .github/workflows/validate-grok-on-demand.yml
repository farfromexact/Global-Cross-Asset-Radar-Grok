name: Validate Grok On-Demand Archive
on:
  push:
    paths:
      - 'reports/*/*/*/**'
      - 'manifests/runs.json'
      - 'manifests/withdrawn_runs.json'
      - 'latest/global.*'
      - 'latest/commodities.*'
      - 'latest/run.json'
      - 'config/grok-publication.json'
      - 'validation/**'
      - '.github/workflows/validate-grok-on-demand.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned validation bundle
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          p = json.loads(Path('config/grok-publication.json').read_bytes())
          assert p['registry_repository'] == 'farfromexact/AI-prompt-repository'
          assert re.fullmatch('[0-9a-f]{40}', p['validator_registry_commit'])
          root = Path('validation').resolve()
          actual = {f.relative_to(Path('.')).as_posix() for f in Path('validation').rglob('*') if f.is_file()}
          assert actual == set(p['validator_files_sha256']), 'Unexpected/missing validator files'
          for name, digest in p['validator_files_sha256'].items():
              path = Path(name).resolve()
              assert path.is_relative_to(root)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          PY
      - run: python -m pip install -r validation/requirements-recovery.txt
      - run: python validation/scripts/grok_publish.py audit --archive .
